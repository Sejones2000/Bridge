<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bridge">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1626" media="(prefers-color-scheme: dark)">
<title>Bridge: FDD flashcards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F7F9; --card: #FFFFFF; --ink: #14213D; --muted: #5B6475;
  --rule: #DCE4F1; --margin: #D1495B; --line: #D6DBE4;
  --again: #B42318; --hard: #A15C07; --good: #1D6B45; --easy: #1F4E8C;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F1626; --card: #18223A; --ink: #E8ECF4; --muted: #9AA4B8;
    --rule: #243150; --margin: #E26D7C; --line: #2A3654;
    --again: #F07167; --hard: #E9A23B; --good: #5CC08A; --easy: #7FA8E8;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
main { max-width: 560px; margin: 0 auto; padding: 20px 18px 32px; min-height: 100%; display: flex; flex-direction: column; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--easy); outline-offset: 2px; }

/* Header */
.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
.brand { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.brand small { font-family: var(--sans); font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.linkbtn { color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }

/* Home: ledger-style summary */
.ledger { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 18px; margin-bottom: 18px; }
.ledger-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.ledger-row:last-child { border-bottom: 0; }
.ledger-row span:first-child { color: var(--muted); }
.ledger-row strong { font-weight: 600; }
.ledger-row.total { border-top: 2px solid var(--ink); border-bottom: 0; margin-top: -1px; }
.ledger-row.total span:first-child { color: var(--ink); font-weight: 600; }

.decks { margin-bottom: 20px; }
.decks h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; background: var(--card); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.primary { display: block; width: 100%; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 15px; font-weight: 600; font-size: 17px; }
.primary:disabled { opacity: 0.4; cursor: default; }
.secondary { display: block; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 13px; font-weight: 500; margin-top: 10px; }
.hint { color: var(--muted); font-size: 14px; margin: 14px 2px 0; }

/* Review */
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
.progress div { height: 100%; background: var(--ink); width: 0; transition: width 0.25s ease; }
.meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.tag { border: 1px solid currentColor; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.tag.app { color: var(--easy); }

/* The index card: the one memorable element */
.card {
  position: relative; background-color: var(--card); border-radius: 6px;
  border: 1px solid var(--line); min-height: 280px; padding: 30px 22px 26px 46px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
  background-position: 0 58px; box-shadow: 0 1px 0 var(--line), 0 12px 24px -18px rgba(20, 33, 61, 0.35);
}
.card::before { content: ""; position: absolute; top: 0; bottom: 0; left: 30px; width: 1.5px; background: var(--margin); opacity: 0.75; }
.q { font-family: var(--serif); font-size: 22px; line-height: 32px; font-weight: 500; margin: 0; }
.a { font-family: var(--serif); font-size: 19px; line-height: 32px; margin: 16px 0 0; padding-top: 14px; border-top: 2px solid var(--ink); }
.yours { font-size: 14px; color: var(--muted); margin: 14px 0 0; line-height: 1.45; }
.yours b { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .a.reveal { animation: reveal 0.22s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

textarea {
  width: 100%; margin-top: 14px; min-height: 76px; resize: vertical; border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; font: 16px/1.45 var(--sans); background: var(--card); color: var(--ink);
}
.actions { margin-top: 16px; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { border-radius: 10px; padding: 10px 4px; background: var(--card); border: 1.5px solid currentColor; font-weight: 600; font-size: 15px; line-height: 1.2; }
.rate button small { display: block; font-weight: 400; font-size: 12px; margin-top: 3px; opacity: 0.85; }
.rate .again { color: var(--again); } .rate .hard { color: var(--hard); }
.rate .good { color: var(--good); } .rate .easy { color: var(--easy); }

/* Done */
.done { text-align: left; }
.done h2 { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 8px 0 12px; }
.done p { color: var(--muted); margin: 0 0 18px; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 class="brand">Bridge<small>FDD flashcards</small></h1>
    <button id="quitBtn" class="linkbtn hidden" type="button">End session</button>
  </header>

  <!-- HOME -->
  <section id="home">
    <div class="ledger" aria-label="Progress">
      <div class="ledger-row"><span>Due for review</span><strong id="statDue">0</strong></div>
      <div class="ledger-row"><span>New cards</span><strong id="statNew">0</strong></div>
      <div class="ledger-row"><span>Learning</span><strong id="statLearning">0</strong></div>
      <div class="ledger-row"><span>Mastered (3+ weeks apart)</span><strong id="statMastered">0</strong></div>
      <div class="ledger-row total"><span>Total cards</span><strong id="statTotal">0</strong></div>
    </div>

    <div class="decks">
      <h2>Sessions to include</h2>
      <div class="chips" id="deckChips"></div>
    </div>

    <button id="startBtn" class="primary" type="button">Start review</button>
    <button id="cramBtn" class="secondary" type="button">Practise all cards (doesn't change schedule)</button>
    <p class="hint" id="homeHint"></p>
    <p class="hint"><button id="resetBtn" class="linkbtn" type="button">Reset all progress</button></p>
  </section>

  <!-- REVIEW -->
  <section id="review" class="hidden">
    <div class="progress"><div id="progressBar"></div></div>
    <div class="meta"><span id="metaDeck"></span><span id="metaTag" class="tag"></span></div>
    <article class="card">
      <p class="q" id="qText"></p>
      <p class="a hidden" id="aText"></p>
      <p class="yours hidden" id="yourAns"></p>
    </article>
    <div id="askArea" class="actions">
      <textarea id="answerInput" placeholder="Answer in your own words first (optional, but it helps it stick)" aria-label="Your answer"></textarea>
      <button id="showBtn" class="primary" type="button" style="margin-top:12px">Show answer</button>
    </div>
    <div id="rateArea" class="actions hidden">
      <div class="rate">
        <button class="again" data-r="0" type="button">Again<small id="iv0"></small></button>
        <button class="hard" data-r="1" type="button">Hard<small id="iv1"></small></button>
        <button class="good" data-r="2" type="button">Good<small id="iv2"></small></button>
        <button class="easy" data-r="3" type="button">Easy<small id="iv3"></small></button>
      </div>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="hidden done">
    <h2 id="doneTitle">Session complete</h2>
    <p id="doneText"></p>
    <button id="homeBtn" class="primary" type="button">Back to overview</button>
  </section>
</main>

<script>
// ---------- Deck ----------
// To add a session: append cards with a new deck name. Keep ids unique and never reuse an id.
var CARDS = [
  {id: "s1-01", deck: "Session 1: Quality of earnings", type: "concept", q: "Why do small EBITDA adjustments matter so much in a deal?", a: "Price is a multiple of EBITDA. At 8x, a 'trivial' £100k adjustment moves the price by £800k."},
  {id: "s1-02", deck: "Session 1: Quality of earnings", type: "concept", q: "What is the goal of quality of earnings work?", a: "To find the true and sustainable earnings the buyer is actually acquiring."},
  {id: "s1-03", deck: "Session 1: Quality of earnings", type: "concept", q: "What question do you ask of every P&L item?", a: "Will the buyer bear this cost, or enjoy this benefit, after completion?"},
  {id: "s1-04", deck: "Session 1: Quality of earnings", type: "concept", q: "What are the four types of EBITDA adjustment?", a: "One-off items, normalisations, accounting/out-of-period items, and pro forma/run-rate adjustments."},
  {id: "s1-05", deck: "Session 1: Quality of earnings", type: "concept", q: "What is a one-off item, and what's the trap?", a: "A genuinely non-recurring cost or income. The trap is 'one-offs' that happen every year."},
  {id: "s1-06", deck: "Session 1: Quality of earnings", type: "concept", q: "What is a normalisation? Give two examples.", a: "Restating costs to what the buyer will actually pay: market-rate salaries for owner-managers, and arm's-length rent on related-party property."},
  {id: "s1-07", deck: "Session 1: Quality of earnings", type: "concept", q: "What is an accounting or out-of-period item, and how is it adjusted?", a: "A cost or credit that belongs to a different period. It usually needs adjusting in two periods, in opposite directions."},
  {id: "s1-08", deck: "Session 1: Quality of earnings", type: "concept", q: "What is a pro forma or run-rate adjustment?", a: "One that reflects known changes not yet in the numbers, such as a lost customer or a new contract."},
  {id: "s1-09", deck: "Session 1: Quality of earnings", type: "concept", q: "When do buyers accept pro forma adjustments?", a: "When they're certain and evidenced, not when they're hopeful."},
  {id: "s1-10", deck: "Session 1: Quality of earnings", type: "concept", q: "How do management's adjustments differ from yours?", a: "Management's almost always push EBITDA up; yours go both ways. Your credibility comes from finding the downward ones management didn't mention."},
  {id: "s1-11", deck: "Session 1: Quality of earnings", type: "concept", q: "What do LTM and TTM stand for?", a: "Last twelve months and trailing twelve months. They mean the same thing."},
  {id: "s1-12", deck: "Session 1: Quality of earnings", type: "concept", q: "What four tests show whether restructuring costs are genuinely one-off?", a: "Frequency (constant restructuring is a run-rate cost), a detailed scope, a defined timeline, and tail costs or future risk (is it still running at completion?)."},
  {id: "s1-13", deck: "Session 1: Quality of earnings", type: "concept", q: "Which restructuring costs are usually valid add-backs, and which aren't?", a: "Valid: one-time severance for a specific tier, and clear site or factory exit penalties. Not valid: retraining ongoing staff, and continuous IT upgrades."},
  {id: "s1-14", deck: "Session 1: Quality of earnings", type: "concept", q: "What structure should a finding follow?", a: "Fact, then evidence, then so what (including its value), then now what (next steps, such as further diligence)."},
  {id: "s1-15", deck: "Session 1: Quality of earnings", type: "application", q: "An insurance settlement is credited to other income. Treatment, and one question to ask?", a: "Remove it, since it's almost always one-off. Ask whether the event-related costs were also in the P&L and need adding back."},
  {id: "s1-16", deck: "Session 1: Quality of earnings", type: "application", q: "An owner-manager earns £40k; a replacement would cost £180k. What's the adjustment?", a: "−£140k. EBITDA is overstated because the buyer must pay the market rate."},
  {id: "s1-17", deck: "Session 1: Quality of earnings", type: "application", q: "Head office is rented from the owner's family at £60k; market rent is £150k. What's the adjustment and value impact at 8x?", a: "−£90k of EBITDA, or £720k off the price."},
  {id: "s1-18", deck: "Session 1: Quality of earnings", type: "application", q: "An FY24 bonus over-accrual of £120k is released as a credit in FY25. What are the adjustments?", a: "+£120k in FY24 (costs were overstated) and −£120k in FY25 (the release flattered EBITDA)."},
  {id: "s1-19", deck: "Session 1: Quality of earnings", type: "application", q: "A customer contributing £1.2m revenue at a 22% margin left last month. What's the adjustment?", a: "A pro forma −£264k to LTM EBITDA, removing profit the buyer won't receive."},
  {id: "s1-20", deck: "Session 1: Quality of earnings", type: "application", q: "Your bridge should start from which number?", a: "Reported EBITDA. Starting from management's figure leads to double counting."},
  {id: "s1-21", deck: "Session 1: Quality of earnings", type: "application", q: "After adjusting each year, what extra check should you make?", a: "Look at the new year-on-year trend. Diligence-adjusted growth can look very different from management's story."},
  {id: "s1-22", deck: "Session 1: Quality of earnings", type: "application", q: "What goes in the headline finding?", a: "The total gap between management's EBITDA and yours, its value impact, the two or three biggest drivers, and a statement that the bid should be based on the diligence figures."}
];

// ---------- Storage ----------
var STORE_KEY = "bridge-fdd-v1";
var NEW_PER_DAY = 15;
var MASTERED_DAYS = 21;

function loadState() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    var s = raw ? JSON.parse(raw) : null;
    if (s && s.cards) return s;
  } catch (e) { /* storage unavailable: fall through */ }
  return { cards: {}, decksOff: [], newSeen: {} };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}
function today() {
  var d = new Date();
  return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
  });
}
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

var state = loadState();

// ---------- Scheduling (simplified SM-2) ----------
function cardState(id) {
  return state.cards[id] || { reps: 0, interval: 0, ease: 2.5, due: null, lapses: 0 };
}
function nextState(cs, r) {
  var n = { reps: cs.reps, interval: cs.interval, ease: cs.ease, due: cs.due, lapses: cs.lapses };
  var t = today();
  if (r === 0) {
    n.lapses = cs.reps > 0 ? cs.lapses + 1 : cs.lapses;
    n.reps = 0; n.interval = 0; n.ease = Math.max(1.3, cs.ease - 0.2); n.due = t;
    return n;
  }
  if (cs.reps === 0) {
    n.interval = r === 1 ? 1 : (r === 2 ? 1 : 4);
  } else if (r === 1) {
    n.interval = Math.max(cs.interval + 1, Math.round(cs.interval * 1.2));
    n.ease = Math.max(1.3, cs.ease - 0.15);
  } else if (r === 2) {
    n.interval = Math.max(cs.interval + 1, Math.round(cs.interval * cs.ease));
  } else {
    n.interval = Math.max(cs.interval + 2, Math.round(cs.interval * cs.ease * 1.3));
    n.ease = cs.ease + 0.15;
  }
  n.reps = cs.reps + 1; n.due = t + n.interval;
  return n;
}
function ivLabel(days) {
  if (days <= 0) return "again now";
  if (days === 1) return "1 day";
  if (days < 30) return days + " days";
  var m = Math.round(days / 30);
  return m === 1 ? "1 month" : m + " months";
}

// ---------- Deck selection ----------
function deckNames() {
  var seen = []; CARDS.forEach(function (c) { if (seen.indexOf(c.deck) < 0) seen.push(c.deck); });
  return seen;
}
function activeCards() {
  return CARDS.filter(function (c) { return state.decksOff.indexOf(c.deck) < 0; });
}
function newLeftToday() {
  var n = state.newSeen[today()] || 0;
  return Math.max(0, NEW_PER_DAY - n);
}

// ---------- Session ----------
var queue = [], total = 0, doneCount = 0, current = null, cramMode = false, sessionAgain = 0;

function buildQueue() {
  var t = today(), due = [], fresh = [];
  activeCards().forEach(function (c) {
    var s = state.cards[c.id];
    if (!s) fresh.push(c);
    else if (s.due <= t) due.push(c);
  });
  fresh = fresh.slice(0, newLeftToday());
  return shuffle(due.concat(fresh)); // interleaved across sessions and card types
}

function startSession(cram) {
  cramMode = cram;
  queue = cram ? shuffle(activeCards().slice()) : buildQueue();
  if (!queue.length) return;
  total = queue.length; doneCount = 0; sessionAgain = 0;
  show("review");
  nextCard();
}

function nextCard() {
  if (!queue.length) { finish(); return; }
  current = queue.shift();
  document.getElementById("qText").textContent = current.q;
  var a = document.getElementById("aText");
  a.textContent = current.a; a.classList.add("hidden"); a.classList.remove("reveal");
  document.getElementById("yourAns").classList.add("hidden");
  document.getElementById("metaDeck").textContent = current.deck;
  var tag = document.getElementById("metaTag");
  tag.textContent = current.type === "application" ? "Apply it" : "Concept";
  tag.className = "tag" + (current.type === "application" ? " app" : "");
  document.getElementById("answerInput").value = "";
  document.getElementById("askArea").classList.remove("hidden");
  document.getElementById("rateArea").classList.add("hidden");
  document.getElementById("progressBar").style.width = (total ? (doneCount / total) * 100 : 0) + "%";
}

function reveal() {
  var a = document.getElementById("aText");
  a.classList.remove("hidden"); a.classList.add("reveal");
  var typed = document.getElementById("answerInput").value.trim();
  var ya = document.getElementById("yourAns");
  if (typed) { ya.innerHTML = "<b>You wrote:</b> " + escHtml(typed); ya.classList.remove("hidden"); }
  var cs = cardState(current.id);
  for (var r = 0; r < 4; r++) {
    document.getElementById("iv" + r).textContent = cramMode ? "" : ivLabel(nextState(cs, r).interval);
  }
  document.getElementById("askArea").classList.add("hidden");
  document.getElementById("rateArea").classList.remove("hidden");
}

function rate(r) {
  if (!current) return;
  if (!cramMode) {
    var wasNew = !state.cards[current.id];
    state.cards[current.id] = nextState(cardState(current.id), r);
    if (wasNew) { var t = today(); state.newSeen[t] = (state.newSeen[t] || 0) + 1; }
    saveState();
  }
  if (r === 0) {
    sessionAgain++;
    queue.splice(Math.min(3, queue.length), 0, current); // see it again shortly
  } else {
    doneCount++;
  }
  nextCard();
}

function finish() {
  current = null;
  document.getElementById("progressBar").style.width = "100%";
  var msg = cramMode
    ? "Practice round done. Your review schedule is unchanged."
    : "Everything due today is reviewed. Cards you found easy won't come back for a while; tricky ones return sooner.";
  if (sessionAgain) msg += " You repeated " + sessionAgain + (sessionAgain === 1 ? " card" : " cards") + " until they stuck.";
  document.getElementById("doneText").textContent = msg;
  show("done");
}

// ---------- Views ----------
function show(view) {
  ["home", "review", "done"].forEach(function (v) {
    document.getElementById(v).classList.toggle("hidden", v !== view);
  });
  document.getElementById("quitBtn").classList.toggle("hidden", view !== "review");
  if (view === "home") renderHome();
  window.scrollTo(0, 0);
}

function renderHome() {
  var t = today(), due = 0, fresh = 0, learning = 0, mastered = 0, cards = activeCards();
  cards.forEach(function (c) {
    var s = state.cards[c.id];
    if (!s) { fresh++; return; }
    if (s.due <= t) due++;
    if (s.interval >= MASTERED_DAYS) mastered++; else learning++;
  });
  document.getElementById("statDue").textContent = due;
  document.getElementById("statNew").textContent = fresh;
  document.getElementById("statLearning").textContent = learning;
  document.getElementById("statMastered").textContent = mastered;
  document.getElementById("statTotal").textContent = cards.length;

  var available = due + Math.min(fresh, newLeftToday());
  var start = document.getElementById("startBtn");
  start.disabled = available === 0;
  start.textContent = available ? "Start review (" + available + ")" : "Nothing due today";
  var hint = "";
  if (!available && fresh) hint = "You've met today's " + NEW_PER_DAY + " new cards. More unlock tomorrow.";
  else if (!available) hint = "All caught up. Come back tomorrow, or practise all cards.";
  else if (fresh > newLeftToday()) hint = "Up to " + NEW_PER_DAY + " new cards a day, so reviews stay manageable.";
  document.getElementById("homeHint").textContent = hint;
  document.getElementById("cramBtn").disabled = cards.length === 0;

  var chips = document.getElementById("deckChips");
  chips.innerHTML = "";
  deckNames().forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = name;
    b.setAttribute("aria-pressed", state.decksOff.indexOf(name) < 0 ? "true" : "false");
    b.addEventListener("click", function () {
      var i = state.decksOff.indexOf(name);
      if (i < 0) state.decksOff.push(name); else state.decksOff.splice(i, 1);
      saveState(); renderHome();
    });
    chips.appendChild(b);
  });
}

// ---------- Wiring ----------
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("startBtn").addEventListener("click", function () { startSession(false); });
  document.getElementById("cramBtn").addEventListener("click", function () { startSession(true); });
  document.getElementById("showBtn").addEventListener("click", reveal);
  document.getElementById("homeBtn").addEventListener("click", function () { show("home"); });
  document.getElementById("quitBtn").addEventListener("click", function () { current = null; show("home"); });
  document.getElementById("resetBtn").addEventListener("click", function () {
    if (confirm("Reset all progress? Every card goes back to new.")) {
      state = { cards: {}, decksOff: [], newSeen: {} }; saveState(); renderHome();
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".rate button"), function (b) {
    b.addEventListener("click", function () { rate(parseInt(b.getAttribute("data-r"), 10)); });
  });
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("review").classList.contains("hidden")) return;
    if (e.target && e.target.id === "answerInput") {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); reveal(); }
      return;
    }
    var rateOpen = !document.getElementById("rateArea").classList.contains("hidden");
    if (!rateOpen && (e.key === " " || e.key === "Enter")) { e.preventDefault(); reveal(); }
    else if (rateOpen && ["1", "2", "3", "4"].indexOf(e.key) >= 0) { rate(parseInt(e.key, 10) - 1); }
  });
  show("home");
});
</script>
</body>
</html>
